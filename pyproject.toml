[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cdavc"
version = "0.1.0"
description = "Contract-driven verification harness for local coding models"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.scripts]
cdavc = "cdavc.cli:main"
cdavc-launch = "cdavc.launch:main"

[tool.setuptools.packages.find]
where = ["src"]
