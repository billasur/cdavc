<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <style>
    .title { fill: #f0f6fc; font-size: 20px; font-weight: 600; }
    .subtitle { fill: #8b949e; font-size: 13px; }
    .axis-label { fill: #8b949e; font-size: 12px; }
    .bar-label { fill: #f0f6fc; font-size: 13px; font-weight: 500; }
    .bar-val { fill: #f0f6fc; font-size: 12px; font-weight: 600; }
    .section-title { fill: #58a6ff; font-size: 15px; font-weight: 600; }
    .grid { stroke: #21262d; stroke-width: 1; }
  </style>

  <!-- Title & Model Info -->
  <text x="40" y="45" class="title">CD-AVC Empirical Benchmark Comparison</text>
  <text x="40" y="70" class="subtitle">Evaluated on real local model: Qwen2.5-7B-Instruct (Q4_K_M) · 10 tasks · Seed: 20261019</text>

  <!-- Metric 1: Pass Rate (Higher is better) -->
  <g transform="translate(40, 110)">
    <text x="0" y="0" class="section-title">1. Pass Rate (% of tasks passed)</text>
    
    <!-- Grid lines -->
    <line x1="160" y1="20" x2="680" y2="20" class="grid" />
    <line x1="160" y1="55" x2="680" y2="55" class="grid" />
    <line x1="160" y1="90" x2="680" y2="90" class="grid" />
    
    <!-- baseline_single -->
    <text x="0" y="35" class="bar-label">baseline_single</text>
    <rect x="160" y="22" width="364" height="20" rx="3" fill="#f85149" opacity="0.85" />
    <text x="532" y="36" class="bar-val">70.0% (7/10)</text>

    <!-- baseline_retry -->
    <text x="0" y="70" class="bar-label">baseline_retry</text>
    <rect x="160" y="57" width="468" height="20" rx="3" fill="#d29922" opacity="0.85" />
    <text x="636" y="71" class="bar-val">90.0% (9/10)</text>

    <!-- cdavc -->
    <text x="0" y="105" class="bar-label">cdavc (cage)</text>
    <rect x="160" y="92" width="468" height="20" rx="3" fill="#2ea043" />
    <text x="636" y="106" class="bar-val">90.0% (+20% gain)</text>
  </g>

  <!-- Metric 2: Mean Prompt Tokens (Lower is better) -->
  <g transform="translate(40, 260)">
    <text x="0" y="0" class="section-title">2. Prompt Token Consumption (Mean input tokens per task)</text>
    
    <!-- baseline_single -->
    <text x="0" y="35" class="bar-label">baseline_single</text>
    <rect x="160" y="22" width="220" height="20" rx="3" fill="#8b949e" opacity="0.6" />
    <text x="388" y="36" class="bar-val">164.8 tok</text>

    <!-- baseline_retry -->
    <text x="0" y="70" class="bar-label">baseline_retry</text>
    <rect x="160" y="57" width="332" height="20" rx="3" fill="#d29922" opacity="0.85" />
    <text x="500" y="71" class="bar-val">249.3 tok (traceback bloat)</text>

    <!-- cdavc -->
    <text x="0" y="105" class="bar-label">cdavc (cage)</text>
    <rect x="160" y="92" width="291" height="20" rx="3" fill="#2ea043" />
    <text x="460" y="106" class="bar-val">218.6 tok (-12.3% vs retry)</text>
  </g>

  <!-- Metric 3: Isolation Overhead summary -->
  <g transform="translate(40, 410)">
    <rect x="0" y="0" width="720" height="48" rx="6" fill="#161b22" stroke="#30363d" />
    <text x="20" y="28" class="subtitle" font-size="12">
      <tspan fill="#58a6ff" font-weight="600">Cage Guarantee:</tspan>
      <tspan fill="#c9d1d9"> 0 cage-hurt cases · Ephemeral git worktree isolation · AST symbol verification · Test SHA-256 locked</tspan>
    </text>
  </g>
</svg>
