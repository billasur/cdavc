<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <style>
    .title { fill: #f0f6fc; font-size: 22px; font-weight: 700; }
    .subtitle { fill: #8b949e; font-size: 13px; }
    .card-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 8px; }
    .section-title { fill: #58a6ff; font-size: 14px; font-weight: 600; letter-spacing: 0.3px; }
    .bar-label { fill: #f0f6fc; font-size: 13px; font-weight: 500; }
    .bar-val { fill: #f0f6fc; font-size: 12px; font-weight: 600; }
    .bar-sub { fill: #8b949e; font-size: 11px; }
    .stat-val { font-size: 26px; font-weight: 700; }
    .stat-label { fill: #8b949e; font-size: 12px; }
    .grid { stroke: #21262d; stroke-width: 1; }
    .badge { font-size: 10px; font-weight: 700; text-anchor: middle; }
    .table-head { fill: #8b949e; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .table-cell { fill: #c9d1d9; font-size: 12px; }
    .table-check { fill: #3fb950; font-weight: 700; font-size: 13px; }
    .table-cross { fill: #f85149; font-weight: 700; font-size: 13px; }
  </style>

  <!-- Title & Model Header -->
  <g transform="translate(36, 36)">
    <text x="0" y="0" class="title">CD-AVC Verification Cage Benchmark</text>
    <text x="0" y="24" class="subtitle">Evaluated on real local model: Qwen2.5-7B-Instruct (Q4_K_M GGUF) · 30 fixed tasks · Seed 20261019</text>
  </g>

  <!-- Top Stat Highlights -->
  <g transform="translate(36, 80)">
    <!-- Card 1: Pass Rate Gain -->
    <rect x="0" y="0" width="250" height="74" class="card-bg" />
    <text x="16" y="32" class="stat-val" fill="#3fb950">+23.3%</text>
    <text x="16" y="52" class="stat-label">Measured Pass-Rate Gain over Baseline</text>
    <text x="16" y="66" class="bar-sub" fill="#3fb950">95% CI: [+7.9%, +38.7%]</text>

    <!-- Card 2: Cage Overhead -->
    <rect x="270" y="0" width="250" height="74" class="card-bg" />
    <text x="286" y="32" class="stat-val" fill="#58a6ff">+2.70s</text>
    <text x="286" y="52" class="stat-label">Worktree &amp; Gate Overhead vs Retry</text>
    <text x="286" y="66" class="bar-sub" fill="#8b949e">24.26s vs 21.56s total wall time</text>

    <!-- Card 3: Context Token Savings -->
    <rect x="540" y="0" width="268" height="74" class="card-bg" />
    <text x="556" y="32" class="stat-val" fill="#d29922">-2.5%</text>
    <text x="556" y="52" class="stat-label">Input Tokens vs Plain Traceback Retry</text>
    <text x="556" y="66" class="bar-sub" fill="#8b949e">280.4 tok vs 287.6 tok (no traceback bloat)</text>
  </g>

  <!-- Chart 1: Pass Rate Comparison -->
  <g transform="translate(36, 180)">
    <rect x="0" y="0" width="390" height="200" class="card-bg" />
    <text x="16" y="28" class="section-title">ACCURACY: PASS RATE (% of 30 tasks)</text>

    <!-- baseline_single -->
    <text x="16" y="65" class="bar-label">baseline_single</text>
    <rect x="135" y="50" width="107" height="22" rx="3" fill="#f85149" opacity="0.85" />
    <text x="302" y="66" class="bar-val">53.3% (16/30)</text>

    <!-- cdavc -->
    <text x="16" y="105" class="bar-label">cdavc (cage)</text>
    <rect x="135" y="90" width="153" height="22" rx="3" fill="#238636" />
    <text x="302" y="106" class="bar-val">76.7% (23/30)</text>

    <!-- baseline_retry -->
    <text x="16" y="145" class="bar-label">baseline_retry*</text>
    <rect x="135" y="130" width="160" height="22" rx="3" fill="#d29922" opacity="0.8" />
    <text x="302" y="146" class="bar-val">80.0% (24/30)</text>

    <text x="16" y="180" class="bar-sub">*baseline_retry leaks held-out test assertion values in error prompt</text>
  </g>

  <!-- Chart 2: Wall Clock Execution Time -->
  <g transform="translate(446, 180)">
    <rect x="0" y="0" width="398" height="200" class="card-bg" />
    <text x="16" y="28" class="section-title">LATENCY &amp; ISOLATION OVERHEAD (Seconds)</text>

    <!-- baseline_single -->
    <text x="16" y="65" class="bar-label">baseline_single</text>
    <rect x="135" y="50" width="89" height="22" rx="3" fill="#8b949e" opacity="0.6" />
    <text x="300" y="66" class="bar-val">13.76s</text>

    <!-- baseline_retry -->
    <text x="16" y="105" class="bar-label">baseline_retry</text>
    <rect x="135" y="90" width="140" height="22" rx="3" fill="#d29922" opacity="0.8" />
    <text x="300" y="106" class="bar-val">21.56s</text>

    <!-- cdavc -->
    <text x="16" y="145" class="bar-label">cdavc (cage)</text>
    <rect x="135" y="130" width="158" height="22" rx="3" fill="#238636" />
    <text x="300" y="146" class="bar-val">24.26s</text>

    <text x="16" y="180" class="bar-sub">CD-AVC overhead vs retry: +2.70s (Git worktree, SHA-256, AST &amp; Regr)</text>
  </g>

  <!-- Integrity & Safety Matrix Table -->
  <g transform="translate(36, 400)">
    <rect x="0" y="0" width="808" height="195" class="card-bg" />
    <text x="20" y="26" class="section-title">INTEGRITY, RESISTANCE &amp; SAFETY MATRIX</text>

    <!-- Table Header -->
    <line x1="20" y1="42" x2="788" y2="42" class="grid" />
    <text x="24" y="38" class="table-head">Protection Dimension</text>
    <text x="370" y="38" class="table-head">baseline_single</text>
    <text x="530" y="38" class="table-head">baseline_retry</text>
    <text x="690" y="38" class="table-head">cdavc (cage)</text>

    <!-- Row 1: Workspace Protection -->
    <line x1="20" y1="68" x2="788" y2="68" class="grid" />
    <text x="24" y="60" class="table-cell">Workspace Contamination Protection</text>
    <text x="370" y="60" class="table-cross">&#x2717; None (mutates repo)</text>
    <text x="530" y="60" class="table-cross">&#x2717; None (leaves dirty files)</text>
    <text x="690" y="60" class="table-check">&#x2713; Git Worktree (0 taint)</text>

    <!-- Row 2: Regression Gate -->
    <line x1="20" y1="94" x2="788" y2="94" class="grid" />
    <text x="24" y="86" class="table-cell">Full Repository Regression Testing</text>
    <text x="370" y="86" class="table-cross">&#x2717; Unchecked</text>
    <text x="530" y="86" class="table-cross">&#x2717; Unchecked</text>
    <text x="690" y="86" class="table-check">&#x2713; Gate 4 (Guaranteed)</text>

    <!-- Row 3: Test Tampering -->
    <line x1="20" y1="120" x2="788" y2="120" class="grid" />
    <text x="24" y="112" class="table-cell">Test Modification / Tamper Protection</text>
    <text x="370" y="112" class="table-cross">&#x2717; Allows test cheating</text>
    <text x="530" y="112" class="table-cross">&#x2717; Allows test cheating</text>
    <text x="690" y="112" class="table-check">&#x2713; Gate 1 (SHA-256 Lock)</text>

    <!-- Row 4: Secret Test Leakage -->
    <line x1="20" y1="146" x2="788" y2="146" class="grid" />
    <text x="24" y="138" class="table-cell">Held-Out / Hidden Assertion Privacy</text>
    <text x="370" y="138" class="table-cell">N/A (single shot)</text>
    <text x="530" y="138" class="table-cross">&#x2717; Leaks answers in prompt</text>
    <text x="690" y="138" class="table-check">&#x2713; Categorical failure only</text>

    <!-- Row 5: AST Contract Enforcement -->
    <text x="24" y="166" class="table-cell">Pre-Execution AST &amp; Symbol Contract</text>
    <text x="370" y="166" class="table-cross">&#x2717; Blind execution</text>
    <text x="530" y="166" class="table-cross">&#x2717; Blind execution</text>
    <text x="690" y="166" class="table-check">&#x2713; Gate 2 (AST Contract)</text>

    <!-- Footer Note -->
    <text x="20" y="185" class="bar-sub" fill="#8b949e">Empirical measurements from results/benchmark30.jsonl · 0 cage-hurt cases observed</text>
  </g>
</svg>
