<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">CD-AVC high-level system design</title>
  <desc id="desc">Cloud contract and test planning feeds an audited task graph. A local model writes implementation patches inside a temporary workspace. Deterministic verification and chaos checks either produce a report or feed failure context back for repair.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163b5c"/><stop offset="1" stop-color="#10263d"/></linearGradient>
    <linearGradient id="local" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173f38"/><stop offset="1" stop-color="#102923"/></linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4d3512"/><stop offset="1" stop-color="#2a210e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66d9a8"/></marker>
    <style>
      .box{stroke:#667085;stroke-width:2;rx:16;filter:url(#shadow)} .label{fill:#f4f4f5;font-family:Inter,Arial,sans-serif;font-size:23px;font-weight:650}.sub{fill:#c7ced9;font-family:Inter,Arial,sans-serif;font-size:16px}.tiny{fill:#94a3b8;font-family:Inter,Arial,sans-serif;font-size:14px}.section{fill:#e5e7eb;font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700;letter-spacing:2px}.line{stroke:#8f99aa;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.green{stroke:#66d9a8;stroke-width:3;fill:none;marker-end:url(#greenArrow);stroke-dasharray:10 8}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="80" y="68" class="section">CD-AVC / CONTRACT-DRIVEN ASYMMETRIC VERIFICATION CAGE</text>
  <text x="80" y="103" class="sub">One cloud planning boundary, one local implementation boundary, deterministic gates, and explicit recovery.</text>

  <rect x="60" y="145" width="690" height="270" fill="url(#cloud)" class="box"/>
  <text x="90" y="185" class="section">CLOUD / ARCHITECTURE PLANE</text>
  <rect x="95" y="220" width="270" height="135" fill="#1d4f78" class="box"/>
  <text x="125" y="262" class="label">Contract planner</text><text x="125" y="293" class="sub">task graph + invariants</text><text x="125" y="320" class="tiny">human spec → structured tasks</text>
  <rect x="430" y="220" width="270" height="135" fill="#1d4f78" class="box"/>
  <text x="460" y="262" class="label">Test synthesizer</text><text x="460" y="293" class="sub">tests + negative cases</text><text x="460" y="320" class="tiny">read-only after audit</text>
  <path d="M365 287 H425" class="line"/>
  <text x="90" y="390" class="tiny">Cloud output is an input artifact, never the verification authority.</text>

  <rect x="820" y="145" width="720" height="270" fill="url(#gate)" class="box"/>
  <text x="850" y="185" class="section">TEST-OF-TESTS / CONTRACT AUDIT</text>
  <rect x="855" y="220" width="285" height="135" fill="#654716" class="box"/>
  <text x="885" y="262" class="label">Test-case auditor</text><text x="885" y="293" class="sub">coverage + contradictions</text><text x="885" y="320" class="tiny">reject weak or unclear suites</text>
  <rect x="1195" y="220" width="300" height="135" fill="#654716" class="box"/>
  <text x="1225" y="262" class="label">Approved task graph</text><text x="1225" y="293" class="sub">contracts + test manifest</text><text x="1225" y="320" class="tiny">immutable execution input</text>
  <path d="M700 287 H850" class="line"/><path d="M1140 287 H1190" class="line"/>

  <rect x="60" y="495" width="720" height="350" fill="url(#local)" class="box"/>
  <text x="90" y="535" class="section">LOCAL IMPLEMENTATION PLANE</text>
  <rect x="95" y="575" width="285" height="145" fill="#1c5a4c" class="box"/>
  <text x="125" y="618" class="label">Runtime adapter</text><text x="125" y="650" class="sub">Mock / llama / MLX</text><text x="125" y="678" class="tiny">cache discovery + memory policy</text>
  <rect x="455" y="575" width="285" height="145" fill="#1c5a4c" class="box"/>
  <text x="485" y="618" class="label">Local coding model</text><text x="485" y="650" class="sub">patch-only response</text><text x="485" y="678" class="tiny">fresh context per attempt</text>
  <path d="M380 647 H450" class="line"/>
  <text x="95" y="780" class="sub">Temporary workspace · bounded retries · original tree protected</text>

  <rect x="845" y="495" width="695" height="350" fill="#171d2c" class="box"/>
  <text x="875" y="535" class="section">DETERMINISTIC VERIFICATION PLANE</text>
  <rect x="880" y="575" width="190" height="145" fill="#26334e" class="box"/><text x="910" y="618" class="label">AST</text><text x="910" y="650" class="sub">contract gate</text><text x="910" y="678" class="tiny">symbols + syntax</text>
  <rect x="1095" y="575" width="190" height="145" fill="#26334e" class="box"/><text x="1125" y="618" class="label">Tests</text><text x="1125" y="650" class="sub">target + regression</text><text x="1125" y="678" class="tiny">bounded subprocess</text>
  <rect x="1310" y="575" width="190" height="145" fill="#26334e" class="box"/><text x="1340" y="618" class="label">Chaos</text><text x="1340" y="650" class="sub">negative cases</text><text x="1340" y="678" class="tiny">declared stress only</text>
  <path d="M780 647 H875" class="line"/><path d="M1070 647 H1090" class="line"/><path d="M1285 647 H1305" class="line"/>

  <rect x="455" y="885" width="330" height="72" fill="#263d31" class="box"/><text x="500" y="929" class="label">PASS → commit + report</text>
  <rect x="880" y="885" width="330" height="72" fill="#512b32" class="box"/><text x="915" y="929" class="label">FAIL → trace + repair</text>
  <path d="M1405 720 C1405 825 620 825 620 880" class="green"/>
  <path d="M1310 720 C1310 840 1045 840 1045 880" class="line"/>
  <path d="M880 921 C650 990 360 940 300 735 C270 690 300 650 455 647" class="green"/>
  <text x="1080" y="974" class="tiny">No green result without deterministic evidence.</text>
</svg>